model_config:
  model_type: "llama"
  architectures:
    - "LlamaForCausalLM"
  
  # Architectural Dimensions
  vocab_size: 32000
  hidden_size: 4096
  num_hidden_layers: 32
  num_attention_heads: 32
  num_key_value_heads: 32  # Multi-Head Attention (MHA)
  intermediate_size: 11008  # SwiGLU hidden dim: 8/3 * hidden_size rounded to 256
  
  # Normalization & Activations
  rms_norm_eps: 1.0e-6
  hidden_act: "silu"
  
  # Positional Embeddings (Rotary Embeddings)
  rope_theta: 10000.0
  max_position_embeddings: 4096
  
  # Kernel & Feature Flags
  use_flash_attention_2: true
  use_fused_rmsnorm: true
  tie_word_embeddings: false
  initializer_range: 0.02

# Standardized Optimization Settings (From Trial 86 HPO Sweep)
optimizer:
  type: "AdamW"
  lr: 0.00095
  weight_decay: 0.04
  betas: [0.9, 0.985]
  eps: 1.95e-07
  grad_clip_norm: 1.0

scheduler:
  type: "cosine_with_warmup"
  warmup_steps: 15