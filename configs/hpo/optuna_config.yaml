optuna_study:
  study_name: "vortexgrid_llm_hpo_sweep"
  direction: "minimize"
  storage_url: "sqlite:///vortexgrid_optuna.db" 
  load_if_exists: true

sampler:
  type: "TPESampler"
  n_startup_trials: 10
  multivariate: true
  group: true
  seed: 42

pruner:
  type: "MedianPruner"
  n_startup_trials: 5
  n_warmup_steps: 25     # Allow 25 steps so LR warmup completes before pruning starts
  interval_steps: 5      # Evaluate pruner every 5 steps to reduce overhead

sweep_execution:
  n_trials: 50
  timeout_seconds: 86400  # 24-hour sweep timeout limit
  n_jobs: 1                # Set to 1 if using a single GPU to prevent CUDA memory contention

search_space:
  learning_rate:
    type: "float"
    low: 1.0e-5
    high: 1.0e-3     # Capped at 1e-3 to prevent gradient explosions in LLM training
    log: true

  warmup_steps:
    type: "int"
    low: 10
    high: 30
    step: 5

  weight_decay:
    type: "float"
    low: 1.0e-4
    high: 0.1
    log: true

  beta2:
    type: "float"
    low: 0.95
    high: 0.999

  adam_eps:
    type: "float"
    low: 1.0e-8
    high: 1.0e-5
    log: true