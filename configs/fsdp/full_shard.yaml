fsdp_config:
  sharding_strategy: "FULL_SHARD"
  backward_prefetch: "BACKWARD_PRE"  
  forward_prefetch: true
  limit_all_gathers: true
  sync_module_states: true
  use_orig_params: true  # Enables PyTorch 2.0+ torch.compile compatibility

  # Mixed Precision Policies
  mixed_precision:
    param_dtype: "bfloat16"
    reduce_dtype: "bfloat16"
    buffer_dtype: "fp32"

  # Activation / Gradient Checkpointing
  activation_checkpointing:
    enabled: true
    selective: true
    checkpoint_wrapper_targets:
      - "TransformerBlock"

  # Offloading Policies
  cpu_offload:
    offload_params: false

  # Auto Wrapping Policy configuration
  auto_wrap_policy:
    type: "transformer_auto_wrap_policy"
    transformer_layer_cls:
      - "TransformerBlock"
    min_num_params: 10000000  