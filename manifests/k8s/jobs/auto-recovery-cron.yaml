apiVersion: batch/v1
kind: CronJob
metadata:
  name: vortexgrid-auto-recovery
  namespace: default
  labels:
    app.kubernetes.io/name: auto-recovery
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: vortexgrid
spec:
  schedule: "*/15 * * * *"  # Every 15 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: auto-recovery-runner
        spec:
          serviceAccountName: vortexgrid-recovery-sa
          restartPolicy: OnFailure
          containers:
            - name: recovery-controller
              image: vortexgrid/cuda-engine:latest
              command:
                - python3
                - -m
                - vortexgrid.scripts.auto_recovery
              env:
                - name: KUBERNETES_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: STALE_POD_THRESHOLD_SECONDS
                  value: "1800"
              resources:
                limits:
                  cpu: "500m"
                  memory: "512Mi"
                requests:
                  cpu: "100m"
                  memory: "128Mi"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vortexgrid-recovery-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vortexgrid-recovery-role
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["kubeflow.org", "ray.io"]
    resources: ["pytorchjobs", "rayclusters", "rayjobs"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vortexgrid-recovery-binding
subjects:
  - kind: ServiceAccount
    name: vortexgrid-recovery-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: vortexgrid-recovery-role
  apiGroup: rbac.authorization.k8s.io