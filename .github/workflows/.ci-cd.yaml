name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Linting & Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy

      - name: Check Code Formatting (Black)
        run: black --check src/ tests/ scripts/

      - name: Lint Codebase (Ruff)
        run: ruff check src/ tests/ scripts/

      - name: Static Type Checking (Mypy)
        run: mypy --ignore-missing-imports src/

  unit-tests:
    name: Unit & Manifest Testing
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
          pip install -e .

      - name: Execute Unit & Kubernetes Manifest Tests
        run: |
          pytest tests/unit/ -v --cov=src/vortexgrid --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration-tests:
    name: Integration Tests (Synthetic Engine)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          pip install -e .

      - name: Execute Integration Tests
        env:
          USE_SYNTHETIC_DATA: "true"
          MASTER_ADDR: "127.0.0.1"
          MASTER_PORT: "29500"
        run: |
          pytest tests/integration/ -v